[project]
name = "job-tracker"
version = "0.1.0"
description = "Gmail -> Claude -> Google Sheets job application tracker"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "gspread>=6.2.1",
    "openai>=3.49.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
